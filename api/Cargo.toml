[package]
name = "arcadia-api"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "Arcadia authenticator, password, and card vault API."

[workspace]
resolver = "3"
members = [
  ".",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Arcadia contributors"]
license = "AGPL-3.0-only"
publish = false
repository = "https://github.com/komputation/arcadia"

[workspace.dependencies]
arche-firestore = { git = "https://github.com/khoek/arche.git", tag = "v0.1.0" }
arche-web = { git = "https://github.com/khoek/arche.git", tag = "v0.1.0" }

anyhow = "1"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = { version = "2", features = ["serde"] }

[dependencies]
arche-firestore = { workspace = true }
arche-web = { workspace = true }

axum = { version = "0.8", features = ["multipart"] }
axum-extra = { version = "0.12", features = ["cookie"] }
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "time", "sync"] }
tower-http = { version = "0.7", features = ["trace", "cors", "set-header"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = "0.1"
anyhow = { workspace = true }
thiserror = "2"
base64 = { workspace = true }
chrono = { version = "0.4", default-features = true, features = ["serde"] }
url = { workspace = true }
time = { version = "0.3", features = ["formatting", "macros", "serde"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "query"] }
firestore = "0.53"
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"
subtle = "2"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
jsonwebtoken = { version = "11", default-features = false, features = ["use_pem", "rust_crypto"] }
rqrr = "0.11"
totp-rs = { version = "6", features = ["otpauth", "serde", "zeroize"] }
rand = "0.10"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
